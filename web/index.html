<script>
/* 加入链接把 liveKitUrl/token 放在 URL fragment（#...）里：浏览器不会把 fragment 发给服务器，
 * 静态托管（GitHub Pages）的日志和 Referer 里都看不到 token。旧链接的 ?token= 仍然可读。
 * 读完立刻从地址栏抹掉，避免进历史记录、被截图或复制转发。放在经典 script 里，不等模块的 CDN 加载。 */
window.__join = (function () {
  var h = new URLSearchParams(location.hash.replace(/^#/, ""));
  var q = new URLSearchParams(location.search);
  var pick = function (k) { return h.get(k) || q.get(k) || ""; };
  var j = { url: pick("liveKitUrl") || pick("url"), token: pick("token") };
  if (h.has("token") || h.has("liveKitUrl") || q.has("token")) {
    q.delete("token"); h.delete("token"); h.delete("liveKitUrl"); h.delete("url");
    var qs = q.toString(), hs = h.toString();
    try { history.replaceState(null, "", location.pathname + (qs ? "?" + qs : "") + (hs ? "#" + hs : "")); } catch (e) {}
  }
  return j;
})();
</script>
<title>多 Bot 语音会议</title>
<style>
:root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --text:#e7e9ee; --dim:#8a93a6; --accent:#4ade80; --warn:#fbbf24; --red:#f87171; --blue:#60a5fa; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:14px/1.55 -apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif; }
header { display:flex; align-items:center; gap:12px; padding:12px 20px; border-bottom:1px solid var(--line); }
header h1 { font-size:16px; margin:0; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:34vw; }
header button, #phase, #status { white-space:nowrap; flex:none; }
#status { overflow:hidden; text-overflow:ellipsis; max-width:22vw; }
#status { color:var(--dim); font-size:13px; }
#phase { font-size:12px; padding:2px 8px; border-radius:99px; background:#222836; color:var(--dim); }
.sp { flex:1 }
button { background:#232836; color:var(--text); border:1px solid #333a4a; border-radius:8px; padding:7px 14px; font-size:14px; cursor:pointer; }
button:hover:not(:disabled) { background:#2b3142; }
button:disabled { opacity:.4; cursor:default; }
button.danger { background:#3a1d1f; border-color:#5b2a2d; color:#fecaca; }
button.primary { background:#163d2a; border-color:#1f5c3c; color:#bbf7d0; }
main { display:grid; grid-template-columns: 1fr 340px; gap:16px; padding:16px 20px; height:calc(100vh - 57px); }
.col { display:flex; flex-direction:column; gap:16px; min-height:0; }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; }
.panel h2 { font-size:12px; letter-spacing:.06em; color:var(--dim); margin:0 0 10px; font-weight:600; }
#grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap:12px; }
.tile { position:relative; background:#11141a; border:1px solid var(--line); border-radius:12px; padding:14px 10px 10px; text-align:center; transition:border-color .15s, box-shadow .15s; }
.tile .av { width:56px; height:56px; border-radius:50%; margin:0 auto 8px; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:600; color:#0b0d11; }
.tile .nm { font-weight:600; font-size:13px; }
.tile .tag { font-size:11px; color:var(--dim); min-height:16px; }
.tile canvas { width:100%; height:28px; display:block; margin-top:6px; }
.tile.speaking { border-color:var(--accent); box-shadow:0 0 0 2px #4ade8044; }
.tile.ducking { border-color:var(--warn); }
.tile.waiting .tag { color:var(--blue); }
.tile .hand { position:absolute; top:8px; right:10px; font-size:16px; display:none; }
.tile.raised .hand { display:block; }
#captions { flex:1; overflow:auto; min-height:0; }
.cap { margin:0 0 10px; display:flex; gap:10px; }
.cap .t { color:var(--dim); font-size:11px; width:44px; flex:none; padding-top:2px; font-variant-numeric:tabular-nums; }
.cap .w { font-weight:600; flex:none; }
.cap .x { color:#d6dae3; }
.cap.human .x { color:#fff; }
.cap.cut .x::after { content:" ⟂ 被打断"; color:var(--red); font-size:11px; }
.cap.interim .x { color:var(--dim); }
.cap .prov { font-size:10px; color:var(--dim); border:1px solid var(--line); border-radius:4px; padding:0 4px; margin-left:4px; }
.sys { color:var(--dim); font-size:12px; margin:0 0 10px 54px; }
.sys.dir { color:var(--blue); } .sys.end { color:var(--warn); }
.ag { padding:8px 0; border-bottom:1px dashed var(--line); }
.ag:last-child { border:0; }
.ag .tt { display:flex; justify-content:space-between; gap:8px; }
.ag.done .tt { color:var(--dim); text-decoration:line-through; }
.ag.cur .tt { color:#fff; font-weight:600; }
.bar { height:4px; background:#232836; border-radius:4px; margin-top:6px; overflow:hidden; }
.bar i { display:block; height:100%; background:var(--accent); width:0; transition:width .5s linear; }
.bar.over i { background:var(--red); }
.q { display:flex; justify-content:space-between; gap:8px; padding:6px 0; border-bottom:1px dashed var(--line); font-size:13px; }
.q:last-child { border:0 }
.q .g { color:var(--dim); font-size:12px; }
.empty { color:var(--dim); font-size:12px; }
.pend { color:var(--blue); }
.pend.ok { color:var(--accent); }
#minutes { display:none; position:fixed; inset:40px 10%; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:22px 28px; overflow:auto; z-index:10; box-shadow:0 20px 60px #000a; }
#minutes h3 { margin-top:0 }
#minutes pre { white-space:pre-wrap; font:13px/1.6 inherit; color:#d6dae3; }
#minutes .close { position:absolute; right:16px; top:14px; }
.act { padding:6px 0; border-bottom:1px dashed var(--line); }
#replaybar { display:none; align-items:center; gap:10px; }
#replaybar input { width:220px; }
.cmt { font-size:13px; padding:5px 0; border-bottom:1px dashed var(--line); }
.cmt:last-child { border:0 }
a { color:var(--blue); }
</style>
</head>
<body>
<header>
  <h1 id="title">多 Bot 语音会议</h1>
  <span id="phase">未开始</span>
  <span id="status">未连接</span>
  <span class="sp"></span>
  <span id="replaybar"><button id="rp-play">▶︎ 播放</button><input id="rp-seek" type="range" min="0" max="1000" value="0"><span id="rp-time" class="g">0:00</span></span>
  <button id="join" class="primary">加入会议</button>
  <button id="mute" disabled>静音</button>
  <button id="interrupt" class="danger" disabled title="立刻打断当前发言者">✋ 打断</button>
  <button id="end" class="danger" disabled>结束会议</button>
  <button id="showmin" disabled>纪要</button>
  <button id="leave" disabled>离开</button>
</header>
<main>
  <div class="col">
    <div class="panel" id="runs" style="display:none"><h2>回放</h2><div id="runlist"></div></div>
    <div class="panel"><h2>参会者</h2><div id="grid"></div></div>
    <div class="panel" style="flex:1;display:flex;flex-direction:column;min-height:0">
      <h2>实时字幕</h2><div id="captions"></div>
    </div>
  </div>
  <div class="col" style="overflow:auto">
    <div class="panel"><h2>议程</h2><div id="agenda"><div class="empty">等待会议开始</div></div></div>
    <div class="panel"><h2>举手队列</h2><div id="hands"><div class="empty">暂无</div></div></div>
    <div class="panel"><h2>问本体（慢路径）</h2><div id="principal"><div class="empty">暂无</div></div></div>
    <div class="panel"><h2>当场承诺 / 决策</h2><div id="commits"><div class="empty">暂无</div></div></div>
  </div>
</main>
<div id="minutes"><button class="close" id="minclose">关闭</button><h3>会后纪要</h3><div id="minbody"></div></div>

<script type="module">
import { Room, RoomEvent, Track } from "https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.esm.mjs";

/* 数据约定（编排器 -> 网页）
 *  meeting.events  : 编排器领域事件原样转发，与 runs/<run>/events.jsonl 每行同构 {type, at, seq, data}
 *  meeting.speaker : {"speaker_id","display_name","state":"speaking|idle|ducking"}（兼容）
 *  meeting.roster  : {"participants":[{"speaker_id","display_name"}]}（兼容）
 *  meeting.level   : 语音层推送 {"type":"level",participant_id,dbfs,t_ms} ~10Hz / {"type":"speaking",participant_id,speaking,t_ms}；人类 id 为房间身份
 *  meeting.minutes : {"markdown": "...", "actions": {"<bot_id>": [ {title, owner_id, status, ...} ]}}
 * 网页 -> 编排器
 *  meeting.control : {"action":"interrupt"|"end"}（编排器只接受 MEETING_HUMAN_IDENTITY 发来的）
 * 回放：?replay=<run> 读 /api/replay/<run>/events 和 mix.wav，按事件的 at 与音频同步。 */
const params = new URLSearchParams(location.search);
const roomName = params.get("room") || "meeting-dev";
const replayRun = params.get("replay");
let identity = params.get("identity") || "";
// Pre-signed join (GitHub Pages or any static host). No token server required.
// 已由 <head> 里的脚本读出并从地址栏抹掉（fragment 优先，兼容旧的 ?token=）。
const presetUrl = window.__join.url;
const presetToken = window.__join.token;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const COLORS = ["#4ade80", "#60a5fa", "#f472b6", "#fbbf24", "#a78bfa", "#34d399", "#fb923c"];

/* ---------------- 状态 ---------------- */
const S = {
  humanId: identity || "host", names: {}, order: [], agenda: [], curItem: null, itemStart: {}, closed: new Set(),
  speaker: null, speakerState: "idle", hands: new Map(), queries: new Map(), commits: [], decisions: [],
  phase: "未开始", now: 0, ended: false, minutes: null, moderator: null,
};
const tiles = new Map();
function name(id) { return S.names[id] || id; }
function ensureTile(id) {
  if (!id || tiles.has(id)) return tiles.get(id);
  const i = tiles.size, c = COLORS[i % COLORS.length];
  const el = document.createElement("div"); el.className = "tile";
  el.innerHTML = `<span class="hand">✋</span><div class="av" style="background:${c}"></div>
    <div class="nm"></div><div class="tag"></div><canvas width="300" height="56"></canvas>`;
  $("grid").appendChild(el);
  const t = { el, color: c, canvas: el.querySelector("canvas"), level: 0, hist: new Array(60).fill(0) };
  tiles.set(id, t); renderTile(id); return t;
}
function renderTile(id) {
  const t = tiles.get(id); if (!t) return;
  t.el.querySelector(".nm").textContent = name(id) + (id === S.humanId ? "（你）" : "");
  t.el.querySelector(".av").textContent = name(id).slice(0, 1);
  const st = S.speaker === id ? S.speakerState : "idle";
  t.el.classList.toggle("speaking", st === "speaking");
  t.el.classList.toggle("ducking", st === "ducking");
  const raised = [...S.hands.values()].some((h) => h.participant_id === id);
  t.el.classList.toggle("raised", raised);
  const waiting = [...S.queries.values()].some((q) => q.asked_by === id && q.status === "pending");
  t.el.classList.toggle("waiting", waiting);
  let tag = st === "speaking" ? "正在发言" : st === "ducking" ? "已压低音量" : "";
  if (!tag && waiting) tag = "等本体答复中…";
  if (!tag && raised) tag = "举手中";
  if (!tag && id === S.moderator) tag = "主持人";
  t.el.querySelector(".tag").textContent = tag;
}
function renderAll() { for (const id of tiles.keys()) renderTile(id); renderAgenda(); renderHands(); renderPrincipal(); renderCommits(); $("phase").textContent = S.phase; }

function renderAgenda() {
  if (!S.agenda.length) return;
  $("agenda").innerHTML = S.agenda.map((a, i) => {
    const done = S.closed.has(a.id), cur = S.curItem === a.id && !done;
    let pct = 0, over = false, right = a.timebox_ms ? fmt(a.timebox_ms) : "";
    if (S.itemStart[a.id] != null) {
      const el = (done ? S.itemStart[a.id + ":end"] : S.now) - S.itemStart[a.id];
      pct = a.timebox_ms ? Math.min(100, (el / a.timebox_ms) * 100) : 0; over = a.timebox_ms && el > a.timebox_ms;
      right = `${fmt(el)} / ${fmt(a.timebox_ms)}`;
    }
    return `<div class="ag ${done ? "done" : ""} ${cur ? "cur" : ""}"><div class="tt"><span>${i + 1}. ${esc(a.title)}</span><span class="g">${right}</span></div>
      ${cur || done ? `<div class="bar ${over ? "over" : ""}"><i style="width:${done ? 100 : pct}%"></i></div>` : ""}</div>`;
  }).join("");
}
function renderHands() {
  const hs = [...S.hands.values()].sort((a, b) => (b.score?.total ?? 0) - (a.score?.total ?? 0));
  $("hands").innerHTML = hs.length ? hs.map((h) => `<div class="q"><div><b>${esc(name(h.participant_id))}</b>${h.kind === "principal_answer" || h.query_id ? ' <span class="pend ok">本体答案</span>' : ""}<div class="g">${esc(h.gist || "")}</div></div>
      <div class="g">${h.score?.total != null ? h.score.total.toFixed(2) : ""}</div></div>`).join("") : `<div class="empty">暂无</div>`;
}
function renderPrincipal() {
  const qs = [...S.queries.values()];
  $("principal").innerHTML = qs.length ? qs.map((q) => {
    const wait = q.status === "pending" ? `等待中 ${fmt(S.now - q.asked_at)}` : q.status === "answered" ? `已答复（${fmt(q.answer_at - q.asked_at)}）` : q.status === "inserted" ? "已插回讨论" : esc(q.status);
    return `<div class="q"><div><b>${esc(name(q.asked_by))}</b> 问本体<div class="g">${esc(q.question)}</div>${q.answer ? `<div class="g">↳ ${esc(q.answer)}</div>` : ""}</div>
      <div class="pend ${q.status !== "pending" ? "ok" : ""}">${wait}</div></div>`;
  }).join("") : `<div class="empty">暂无</div>`;
}
function renderCommits() {
  const rows = [...S.commits.map((c) => `<div class="cmt">🤝 <b>${esc(name(c.owner_id))}</b>：${esc(c.text)} <span class="g">${esc(c.status || "")}</span></div>`),
    ...S.decisions.map((d) => `<div class="cmt">📌 ${esc(d.text)}</div>`)];
  $("commits").innerHTML = rows.length ? rows.join("") : `<div class="empty">暂无</div>`;
}

/* ---------------- 字幕 ---------------- */
const interimEls = new Map();
function caption(id, text, at, opts = {}) {
  const box = $("captions"); const stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
  let el = opts.key && interimEls.get(opts.key);
  if (!el) { el = document.createElement("div"); box.appendChild(el); if (opts.key) interimEls.set(opts.key, el); }
  el.className = "cap" + (id === S.humanId ? " human" : "") + (opts.cut ? " cut" : "") + (opts.interim ? " interim" : "");
  const c = tiles.get(id)?.color || "#aaa";
  el.innerHTML = `<span class="t">${at != null ? fmt(at) : ""}</span><span class="w" style="color:${c}">${esc(name(id))}</span><span class="x">${esc(text)}${opts.prov ? `<span class="prov">${esc(opts.prov)}</span>` : ""}</span>`;
  if (!opts.interim && opts.key) interimEls.delete(opts.key);
  if (stick) box.scrollTop = box.scrollHeight;
}
function sysline(text, cls = "") {
  const box = $("captions"); const el = document.createElement("div"); el.className = "sys " + cls; el.textContent = text; box.appendChild(el);
  box.scrollTop = box.scrollHeight;
}

/* ---------------- 事件归约 ---------------- */
const PROV = { snapshot: "快照", brief: "brief", principal: "本体", model: "" };
function apply(ev) {
  const d = ev.data || {}, at = ev.at ?? S.now; S.now = Math.max(S.now, at);
  switch (ev.type) {
    case "MeetingCreated": {
      const p = d.payload || {}; S.agenda = p.agenda || []; S.moderator = p.moderator?.participant_id || null;
      if (p.linked_human_id) S.humanId = p.linked_human_id;
      if (p.title) $("title").textContent = p.title;
      break;
    }
    case "SpeakerPublished": {
      const p = d.payload || {};
      if (p.participants) p.participants.forEach((x) => { S.names[x.speaker_id] = x.display_name; ensureTile(x.speaker_id); });
      if (p.speaker_id) { S.names[p.speaker_id] = p.display_name || S.names[p.speaker_id]; ensureTile(p.speaker_id); S.speaker = p.speaker_id; S.speakerState = p.state || "idle"; }
      break;
    }
    case "PhaseChanged": if (d.layer === "phase" || !d.layer) S.phase = PHASE[d.to] || d.to; break;
    case "AgendaItemStarted": S.curItem = d.agenda_item_id; S.itemStart[d.agenda_item_id] = at; break;
    case "AgendaItemClosed": S.closed.add(d.agenda_item_id); S.itemStart[d.agenda_item_id + ":end"] = at; break;
    case "FloorGranted": { const h = d.token?.holder_id; S.speaker = h; S.speakerState = "speaking"; ensureTile(h);
      for (const [k, v] of S.hands) if (v.participant_id === h) S.hands.delete(k);
      const src = d.token?.source;
      if (src === "handRaise") sysline(`${name(h)} 举手获准发言`);
      else if (src === "pendingAnswer") sysline(`${name(h)} 带着本体答复插回讨论`, "dir");
      else if (src === "moderatorCue" && h !== S.moderator && S.moderator) sysline(`主持人点名 ${name(h)}`);
      break; }
    case "FloorReleased": case "FloorRevoked": if (S.speaker === d.token?.holder_id) S.speakerState = "idle"; break;
    case "Ducked": if (S.speaker === d.speakerId) S.speakerState = "ducking"; break;
    case "Restored": if (S.speaker === d.speakerId) S.speakerState = "speaking"; break;
    case "Interrupted": sysline(`${name(d.by)} 打断了 ${name(d.speakerId)}`, "dir"); break;
    case "HumanVad": if (d.stage === "start") { S.speaker = d.participant_id; S.speakerState = "speaking"; ensureTile(d.participant_id); }
      else if (d.stage === "end" && S.speaker === d.participant_id) S.speakerState = "idle"; break;
    case "HumanDirective": if (d.stage === "parsed") sysline(`指令 → ${d.target ? name(d.target) : "主持人"}：${d.text}`, "dir"); break;
    case "HandRaised": S.hands.set(d.hand.id, d.hand); break;
    case "HandExpired": case "HandWithdrawn": case "HandGranted": S.hands.delete(d.hand?.id || d.hand_id); break;
    case "PrincipalAsked": S.queries.set(d.query.id, { ...d.query }); break;
    case "PrincipalAnswered": { const q = S.queries.get(d.query.id) || { ...d.query }; q.status = "answered"; q.answer = d.query.answer?.text; q.answer_at = d.query.answer?.received_at ?? at; S.queries.set(q.id, q); break; }
    case "PrincipalInserted": { const q = S.queries.get(d.query_id || d.query?.id); if (q) q.status = "inserted"; break; }
    case "CommitmentMade": S.commits.push(d.commitment); break;
    case "DecisionRecorded": S.decisions.push(d.payload || d); break;
    case "UtteranceFinal": { const u = d.utterance;
      if (u.provenance === "principal") for (const q of S.queries.values()) if (q.asked_by === u.speaker_id && q.status === "answered") q.status = "inserted";
      caption(u.speaker_id, u.interrupted ? (u.text.startsWith("（") ? "（话说到一半被打断）" : u.text) : u.text, u.ended_at, { cut: !!u.interrupted, prov: PROV[u.provenance] });
      if (S.speaker === u.speaker_id && u.speaker_id === S.humanId) S.speakerState = "idle"; break; }
    case "EndConfirm": if (d.stage === "asked") sysline("主持人询问是否结束", "end"); else sysline(`结束确认：${d.stage}`, "end"); break;
    case "MeetingEnded": S.ended = true; S.phase = "已结束"; sysline("会议结束", "end"); onEnded(); break;
  }
}
const PHASE = { Inviting: "邀请中", Preparing: "会前准备", OpeningSync: "开场同步", InAgenda: "讨论中", Deciding: "形成决策", Closing: "收尾", PostMeeting: "会后", Ended: "已结束" };

/* ---------------- 纪要 ---------------- */
async function onEnded() {
  $("showmin").disabled = false;
  if (replayRun && !S.minutes) S.minutes = await (await fetch(`/api/replay/${encodeURIComponent(replayRun)}/minutes`)).json();
  if (S.minutes) showMinutes();
}
function showMinutes() {
  const m = S.minutes || { markdown: "（纪要尚未收到）", actions: {} };
  const acts = Object.entries(m.actions || {}).map(([bot, list]) => `<div class="act"><b>${esc(name(bot))}</b><ul>${(list || []).map((a) => `<li>${esc(a.title || a.text)} <span class="g">${esc(a.status || "")}</span></li>`).join("")}</ul></div>`).join("") || '<div class="empty">无行动项</div>';
  $("minbody").innerHTML = `<h4>行动项（按 bot）</h4>${acts}<h4>全文</h4><pre>${esc(m.markdown)}</pre>`;
  $("minutes").style.display = "block";
}
$("showmin").onclick = showMinutes; $("minclose").onclick = () => ($("minutes").style.display = "none");

/* ---------------- 音量波形 ---------------- */
let actx; const analysers = new Map(); // key: participant identity or "mix"
function audioCtx() { return (actx ||= new AudioContext()); }
function addAnalyser(key, node) { const a = audioCtx().createAnalyser(); a.fftSize = 512; node.connect(a); analysers.set(key, { a, buf: new Float32Array(a.fftSize) }); }
const PL = new Map(), PS = new Map(); // meeting.level 推送的音量 / 说话状态
function pushedLevel(id) { const x = PL.get(id); return x && performance.now() - x.at < 400 ? x.v : null; }
function level(key) { const x = analysers.get(key); if (!x) return 0; x.a.getFloatTimeDomainData(x.buf); let s = 0; for (const v of x.buf) s += v * v; return Math.min(1, Math.sqrt(s / x.buf.length) * 6); }
let agentIdentity = null;
let RL = null; // 回放电平 {step_ms, tracks:{identity:[db...]}}
let TL = []; // 回放发言者时间线 [[at, holder|null]]
function holderAt(t) { let h = null; for (const [a, x] of TL) { if (a > t) break; h = x; } return h; }
function replayHist(id, n) {
  if (!RL) return new Array(n).fill(0);
  const direct = RL.tracks[id];
  const shared = !direct;
  const ids = Object.keys(RL.tracks);
  const tr = direct || RL.tracks[ids.find((i) => i !== S.humanId)] || [];
  const k = Math.floor(S.now / RL.step_ms), out = [];
  const isH = id === S.humanId;
  for (let i = k - n + 1; i <= k; i++) {
    const db = tr[i] ?? -120, v = Math.max(0, Math.min(1, (db + 55) / 40));
    out.push(!shared || isH || holderAt(i * RL.step_ms) === id ? v : 0);
  }
  return out;
}
function replayLevel(isHuman) {
  if (!RL) return 0; const k = Math.floor(S.now / RL.step_ms);
  const ids = Object.keys(RL.tracks); const id = isHuman ? ids.find((i) => i === S.humanId) : ids.find((i) => i !== S.humanId);
  const db = RL.tracks[id]?.[k] ?? -120; return Math.max(0, Math.min(1, (db + 55) / 40));
}
function tick() {
  for (const [id, t] of tiles) {
    let lv = 0; const pl = pushedLevel(id);
    if (pl !== null) lv = pl;
    else if (id === S.humanId) lv = level("local") || level(id);
    else if (S.speaker === id && S.speakerState !== "idle") lv = level(agentIdentity) || level("mix");
    if (replayRun) t.hist = replayHist(id, t.hist.length);
    else { t.hist.push(lv); t.hist.shift(); }
    const g = t.canvas.getContext("2d"), W = t.canvas.width, H = t.canvas.height; g.clearRect(0, 0, W, H);
    g.fillStyle = (S.speaker === id && S.speakerState !== "idle") ? t.color : "#3a4256";
    const bw = W / t.hist.length;
    t.hist.forEach((v, i) => { const h = Math.max(2, v * H); g.fillRect(i * bw + 1, (H - h) / 2, bw - 2, h); });
  }
  if (!replayRun) { renderAgenda(); renderPrincipal(); }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ---------------- 实时模式 ---------------- */
let room;
function setLive(on) { $("mute").disabled = $("leave").disabled = $("interrupt").disabled = $("end").disabled = !on; $("join").disabled = on; }
async function control(action) {
  if (!room) return;
  await room.localParticipant.publishData(new TextEncoder().encode(JSON.stringify({ action })), { reliable: true, topic: "meeting.control" });
  sysline(action === "end" ? "你发出了：结束会议" : "你发出了：打断", "dir");
}
$("interrupt").onclick = () => control("interrupt");
$("end").onclick = () => { if (confirm("确定结束会议？")) control("end"); };

$("join").onclick = async () => {
  if (replayRun) return;
  $("join").disabled = true; $("status").textContent = presetToken ? "正在连接…" : "获取 token…";
  try {
    let url, token, myId;
    if (presetUrl && presetToken) {
      url = presetUrl; token = presetToken; myId = identity || "host";
    } else {
      const r = await fetch(`/api/token?room=${encodeURIComponent(roomName)}${identity ? "&identity=" + encodeURIComponent(identity) : ""}`);
      if (!r.ok) throw new Error(await r.text());
      ({ url, token, identity: myId } = await r.json());
    }
    identity = myId; S.humanId = myId; S.names[myId] ||= "用户"; ensureTile(myId);
    room = new Room({ adaptiveStream: true, audioCaptureDefaults: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    room.on(RoomEvent.TrackSubscribed, (track, _pub, p) => {
      if (track.kind !== Track.Kind.Audio) return;
      const el = track.attach(); el.dataset.p = p.identity; document.body.appendChild(el);
      try { addAnalyser(p.identity, audioCtx().createMediaStreamSource(new MediaStream([track.mediaStreamTrack]))); } catch {}
      if (p.identity.startsWith("agent-")) agentIdentity = p.identity;
    });
    room.on(RoomEvent.LocalTrackPublished, (pub) => {
      if (pub.track?.kind === Track.Kind.Audio) try { addAnalyser("local", audioCtx().createMediaStreamSource(new MediaStream([pub.track.mediaStreamTrack]))); } catch {}
    });
    room.on(RoomEvent.TrackUnsubscribed, (track) => track.detach().forEach((e) => e.remove()));
    room.on(RoomEvent.Disconnected, () => { $("status").textContent = "已断开"; setLive(false); });
    room.on(RoomEvent.DataReceived, (payload, _p, _k, topic) => {
      let m; try { m = JSON.parse(new TextDecoder().decode(payload)); } catch { return; }
      if (topic === "meeting.events") { (Array.isArray(m) ? m : [m]).forEach(apply); }
      else if (topic === "meeting.roster" && m.participants) m.participants.forEach((x) => { S.names[x.speaker_id] = x.display_name; ensureTile(x.speaker_id); });
      else if (topic === "meeting.speaker") { S.names[m.speaker_id] ||= m.display_name; ensureTile(m.speaker_id); S.speaker = m.speaker_id; S.speakerState = m.state; }
      else if (topic === "meeting.level") {
        const pid = m.participant_id === "__HUMAN__" ? S.humanId : m.participant_id;
        if (m.type === "level") PL.set(pid, { v: Math.max(0, Math.min(1, (m.dbfs + 55) / 40)), at: performance.now() });
        else if (m.type === "speaking") { PS.set(pid, !!m.speaking); if (!m.speaking) PL.set(pid, { v: 0, at: performance.now() }); }
      }
      else if (topic === "meeting.minutes") { S.minutes = m; $("showmin").disabled = false; showMinutes(); }
      renderAll();
    });
    room.registerTextStreamHandler("lk.transcription", async (reader, info) => {
      const seg = reader.info.attributes?.["lk.segment_id"] || reader.info.id;
      const who = info.identity === identity ? identity : (S.speaker || info.identity);
      let text = ""; for await (const c of reader) { text += c; caption(who, text, null, { key: seg, interim: true }); }
      const el = interimEls.get(seg); if (el) { el.remove(); interimEls.delete(seg); } // 终稿以 UtteranceFinal 为准
    });
    await room.connect(url, token);
    await room.localParticipant.setMicrophoneEnabled(true);
    await room.startAudio(); audioCtx().resume();
    $("status").textContent = `已连接 ${roomName}`; setLive(true);
  } catch (e) { $("status").textContent = "连接失败：" + e.message; $("join").disabled = false; }
};
$("mute").onclick = async () => { const on = room.localParticipant.isMicrophoneEnabled; await room.localParticipant.setMicrophoneEnabled(!on); $("mute").textContent = on ? "取消静音" : "静音"; };
$("leave").onclick = () => room?.disconnect();
if (presetUrl && presetToken && !replayRun) $("status").textContent = "链接已带 token，点击加入";

/* ---------------- 回放入口：本地 token_server 才有 /api/replay；静态托管上 404，面板保持隐藏 ---------------- */
if (!replayRun && !presetToken) (async () => {
  try {
    const r = await fetch("/api/replay");
    if (!r.ok) return;
    const runs = ((await r.json()).runs || []).filter((x) => typeof x === "string").reverse();
    if (!runs.length) return;
    $("runlist").innerHTML = runs.map((x) => `<div class="q"><a href="?replay=${encodeURIComponent(x)}">${esc(x)}</a></div>`).join("");
    $("runs").style.display = "";
  } catch {}
})();

/* ---------------- 回放模式 ---------------- */
if (replayRun) (async () => {
  $("join").style.display = "none"; $("replaybar").style.display = "flex"; $("status").textContent = `回放 ${replayRun}（打断/结束按钮仅实时会议可用）`;
  const j = await (await fetch(`/api/replay/${encodeURIComponent(replayRun)}/events`)).json();
  RL = await (await fetch(`/api/replay/${encodeURIComponent(replayRun)}/levels`)).json();
  const evs = j.events.sort((a, b) => a.seq - b.seq); const off = j.audio_offset_ms || 0;
  for (const e of evs) {
    if (e.type === "FloorGranted") TL.push([e.at, e.data.token.holder_id]);
    else if (e.type === "FloorReleased" || e.type === "FloorRevoked") TL.push([e.at + 300, null]);
  }
  const endAt = evs.length ? evs[evs.length - 1].at : 0;
  const audio = new Audio(`/api/replay/${encodeURIComponent(replayRun)}/audio`); audio.preload = "auto"; audio.crossOrigin = "anonymous";
  let srcNode; let idx = 0;
  const startAt = Number(params.get("t") || 0) * 1000;
  function reset() { Object.assign(S, { names: {}, agenda: [], curItem: null, itemStart: {}, closed: new Set(), speaker: null, speakerState: "idle", hands: new Map(), queries: new Map(), commits: [], decisions: [], ended: false, now: 0 });
    $("captions").innerHTML = ""; $("grid").innerHTML = ""; tiles.clear(); idx = 0; }
  function advance(t) { if (t < S.now - 1) reset(); while (idx < evs.length && evs[idx].at <= t) apply(evs[idx++]); S.now = t; renderAll();
    $("rp-time").textContent = `${fmt(t)} / ${fmt(endAt)}`; $("rp-seek").value = Math.round((t / Math.max(1, endAt)) * 1000); }
  const meetingT = () => audio.currentTime * 1000 - off;
  setInterval(() => { if (!audio.paused) advance(meetingT()); }, 100);
  $("rp-play").onclick = async () => {
    if (!srcNode) { srcNode = audioCtx().createMediaElementSource(audio); srcNode.connect(audioCtx().destination); addAnalyser("mix", srcNode); }
    await audioCtx().resume();
    if (audio.paused) { if (audio.currentTime === 0) audio.currentTime = (off + startAt) / 1000; await audio.play(); $("rp-play").textContent = "⏸ 暂停"; }
    else { audio.pause(); $("rp-play").textContent = "▶︎ 播放"; }
  };
  $("rp-seek").oninput = (e) => { const t = (e.target.value / 1000) * endAt; audio.currentTime = (off + t) / 1000; advance(t); };
  advance(startAt || 0);
  if (params.get("autoplay") === "silent") { // 截图/无声预演：不出声，按墙钟推进
    const t0 = performance.now() - startAt; setInterval(() => advance(performance.now() - t0), 100);
  }
})();
</script>
</body>
