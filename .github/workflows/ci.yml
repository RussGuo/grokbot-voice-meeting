name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check meet providers orchestrator/scene.py orchestrator/i18n.py orchestrator/commitments.py orchestrator/principal.py meet/cli.py scripts/mklink.py scripts/acceptance.py
      - name: Tests
        run: python -m pytest orchestrator/tests meet/tests providers/tests -q
      - name: Voice tests
        run: python -m pytest voice/tests -q
